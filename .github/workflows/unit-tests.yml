# This workflow builds and runs unit tests.

name: unit-tests

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Builds the unit tests and runs them
  run-unit-tests:
    name: Run unit-tests
    # Runs on ubuntu
    runs-on: ubuntu-latest
    # Timeout after
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 2

      # Set up GH_TOKEN for authentication
      - name: Set up GitHub CLI token
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install cmake openssl libssl-dev libxml2-dev libarchive-dev jq ccache -y

      # Set up ccache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: ${{ github.job }}-${{ matrix.os || 'ubuntu-latest' }}
          max-size: 500M

      # Build the unit tests
      - name: Build unit tests
        run: |
          mkdir build
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DRALF_UTILS_BUILD_UNIT_TESTS:BOOL=ON \
            -DRALF_UTILS_ENABLE_ADDRESS_SANITIZER=ON \
            -DRALF_UTILS_ENABLE_UNDEFINED_BEHAVIOUR_SANITIZER=ON \
            -S . -B build
          cmake --build build

      # Run the unit tests
      - name: Run unit tests
        run: |
          ctest --test-dir build/test --output-on-failure --output-junit unit_test_reports.xml

      - name: Upload test results
        uses: dorny/test-reporter@v2.1.1
        if: failure()
        with:
          name: Unit test failures
          path: build/test/unit_test_reports.xml
          reporter: java-junit
